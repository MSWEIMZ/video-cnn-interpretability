name: Daily Paper Search

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  search-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install arxiv feedparser requests

      - name: Run paper search
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: PYTHONPATH=src python -m video_cnn_interp.cli run-daily

      - name: Commit and push (whitelist)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add papers/index.jsonl README.md README_zh.md ALL_PAPERS.md ALL_PAPERS_zh.md TOPICS.md dashboard.html papers/
          git diff --staged --quiet || git commit -m "Update papers - $(date +'%Y-%m-%d')"
          git push
