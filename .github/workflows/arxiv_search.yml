name: Daily Paper Search

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-paper-search-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  search-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Run paper search
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: PYTHONPATH=src python -m video_cnn_interp.cli run-daily

      - name: Commit and push (whitelist)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add papers/index.jsonl papers/quarantine.jsonl README.md README_zh.md ALL_PAPERS.md ALL_PAPERS_zh.md TOPICS.md TRENDS.md dashboard.html
          git diff --staged --check
          git diff --staged --quiet || git commit -m "Update papers - $(date +'%Y-%m-%d')"
          git push
